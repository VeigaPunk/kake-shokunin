<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lucario</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#111; color:#eee;
         margin:0; display:flex; flex-direction:column; align-items:center; }
  h1 { font-weight:600; letter-spacing:.02em; margin:3rem 0 1rem; }
  h1 span { color:#7cf; }
  form { width:min(720px,92vw); display:flex; }
  input { flex:1; padding:.9rem 1rem; font-size:1.1rem; border-radius:8px 0 0 8px;
          border:1px solid #333; background:#1b1b1b; color:#eee; outline:none; }
  input:focus { border-color:#7cf; }
  button { padding:0 1.4rem; border:0; border-radius:0 8px 8px 0;
           background:#7cf; color:#111; font-weight:600; cursor:pointer; }
  #status { width:min(720px,92vw); margin-top:1rem; color:#999; font-size:.9rem; }
  #pods { width:min(720px,92vw); margin-top:2rem; padding-bottom:4rem; }
  .pod { background:#1b1b1b; border:1px solid #2a2a2a; border-radius:10px;
         margin:.8rem 0; overflow:hidden; }
  .pod h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em;
            color:#999; background:#222; margin:0; padding:.5rem .9rem; }
  .pod pre { margin:0; padding:.9rem; font-size:1rem; white-space:pre-wrap;
             overflow-x:auto; }
  .err { color:#f88; }
</style>
</head>
<body>
<h1>lucario<span>.</span></h1>
<form id="f"><input id="q" autofocus placeholder="derivative of x^3 sin(x)" disabled>
<button disabled>=</button></form>
<div id="status">loading computational engine (sympy on pyodide)…</div>
<div id="pods"></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>
<script>
const pods = document.getElementById('pods');
const status = document.getElementById('status');
const input = document.getElementById('q');
const btn = document.querySelector('button');
let query = null;

async function boot() {
  try {
    const py = await loadPyodide();
    status.textContent = 'loading sympy…';
    await py.loadPackage('sympy');
    const engineSrc = await fetch('engine.py').then(r => {
      if (!r.ok) throw new Error('engine.py ' + r.status);
      return r.text();
    });
    py.FS.writeFile('/engine.py', engineSrc);
    py.runPython('import sys, json\nsys.path.insert(0, "/")\nimport engine');
    query = (q) => JSON.parse(py.runPython(
      'json.dumps(engine.query(' + JSON.stringify(q) + ').as_dict())'));
    status.textContent = 'ready — try "solve x^2 - 5x + 6 = 0"';
    input.disabled = btn.disabled = false;
    input.focus();
  } catch (e) {
    status.innerHTML = '<span class="err">engine failed to load: ' + e.message + '</span>';
  }
}

document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || !query) return;
  pods.innerHTML = '';
  const r = query(q);
  if (r.error) {
    pods.innerHTML = `<div class="pod"><h2>error</h2><pre class="err"></pre></div>`;
    pods.querySelector('pre').textContent = r.error;
    return;
  }
  for (const p of r.pods) {
    const el = document.createElement('div');
    el.className = 'pod';
    const h = document.createElement('h2'); h.textContent = p.title;
    const pre = document.createElement('pre'); pre.textContent = p.plaintext;
    el.append(h, pre); pods.appendChild(el);
  }
});

boot();
</script>
</body>
</html>
